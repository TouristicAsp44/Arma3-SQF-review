[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arma3-sqf-review"
version = "1.1.0"
description = "Plugin y suite de análisis y revisión SQF para Arma 3"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Touri" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
linter = [
    "sqflint>=0.3.2",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "anyio>=4.0.0",
    "platformdirs>=4.0.0",
    "ruff>=0.4.0",
    "sqflint>=0.3.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "skills/arma3-sqf-review/scripts",
    "skills/arma3-sqf-review/references",
    "."
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
mypy_path = "skills/arma3-sqf-review/scripts"

[tool.pyright]
extraPaths = [
    "skills/arma3-sqf-review/scripts",
    "skills/arma3-sqf-review/references",
    "."
]

[tool.setuptools]
py-modules = ["sqf_models", "sqf_orchestrator"]

[tool.setuptools.package-dir]
"" = "skills/arma3-sqf-review/scripts"
